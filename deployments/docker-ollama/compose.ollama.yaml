# Adds Ollama as a container and points Machinist at it.
# Use together with compose.yaml; add compose.gpu.yaml for an NVIDIA GPU.

services:
  ollama:
    image: docker.io/ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    container_name: esf-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Coding agents need a long context; Ollama's default is too small for
      # tool calling over a repository.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama-models:/root/.ollama
    ports:
      # Optional: reach the containerised Ollama from host tools.
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  # One-shot: pulls the configured model(s) into the ollama-models volume.
  ollama-pull:
    image: docker.io/ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    container_name: esf-ollama-pull
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${OLLAMA_MODELS:-${OLLAMA_MODEL:-qwen3-coder:30b}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'for m in $(echo "$$MODELS" | tr "," " "); do ollama pull "$$m" || exit 1; done'

  machinist:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama-models:
    name: esf-ollama-models
